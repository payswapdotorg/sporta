name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install ffmpeg (the battery's real-media gates require it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Typecheck (sequential — memory discipline on the 2-vCPU hosted runner)
        run: bun run typecheck:series
      - name: Test
        run: bun test
      - name: Check formatting
        run: bun run format:check

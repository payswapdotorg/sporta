name: YT source fetch

on:
  push:
    branches: [probe/yt-source-fetch]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Probe YouTube egress
        run: |
          set -x
          curl -s -o /dev/null -w "watch:%{http_code} redirect:%{redirect_url}\n" --max-time 25 \
            "https://www.youtube.com/watch?v=93LPZJkCW2w" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"
          curl -sL -o yt-dlp --max-time 90 \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          chmod +x yt-dlp
          ./yt-dlp --version
          ./yt-dlp -J --skip-download \
            "https://www.youtube.com/watch?v=93LPZJkCW2w" > /tmp/meta.json 2> /tmp/err.txt || true
          tail -c 400 /tmp/err.txt || true
          python3 - <<'EOF' || echo "METADATA FAILED (walled or unavailable)"
          import json
          try:
              d = json.load(open('/tmp/meta.json'))
          except Exception:
              raise SystemExit(1)
          print('TITLE:', d.get('title'))
          print('DURATION:', d.get('duration'), 'seconds')
          print('FORMATS:', len(d.get('formats') or []))
          best = [f for f in (d.get('formats') or []) if f.get('vcodec') != 'none' and f.get('acodec') != 'none' and f.get('height')]
          print('BEST_MERGED:', [f"{f.get('height')}p/{f.get('format_id')}" for f in best[-4:]])
          json.dump({k: d.get(k) for k in ('title','id','duration','channel','uploader','upload_date','view_count','resolution','width','height','ext')},
                    open('/tmp/probe-summary.json','w'))
          EOF

      - name: Download real source video
        run: |
          set -x
          # 720p preferred, fall back to best merged <=480, then best single file
          ./yt-dlp -f "bv*[height<=720]+ba/b[height<=720]/bv*[height<=480]+ba/b[height<=480]/b" \
            --merge-output-format mp4 -o source.mp4 \
            "https://www.youtube.com/watch?v=93LPZJkCW2w" 2>&1 | tail -6
          ls -la source.mp4* 2>/dev/null || echo "DOWNLOAD FAILED"
          sha256sum source.mp4 > source.mp4.sha256 2>/dev/null || true
          ffprobe -v quiet -print_format json -show_format -show_streams source.mp4 > source.ffprobe.json 2>/dev/null || true

      - name: Capture source metadata for provenance
        if: always()
        run: |
          ./yt-dlp --write-info-json --skip-download -o source \
            "https://www.youtube.com/watch?v=93LPZJkCW2w" 2>&1 | tail -3 || true
          ls -la source* 2>/dev/null || true

      - name: Upload source + provenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-source
          include-hidden-files: true
          path: |
            source.mp4
            source.mp4.sha256
            source.ffprobe.json
            source.info.json

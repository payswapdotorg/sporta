wave2:
  worth_trial:
    - rank: 1
      id: w2.ebsynth-propagation
      what: "EbSynth propagation seeded by OUR deterministic keyframes (SPR103/104/109)"
      why: "hand-painted quality + temporal consistency by construction + CPU + commercial-OK terms; consumes our renderer output; provider-neutral"
      evidence: [https://github.com/jamriska/ebsynth, https://dcgi.fel.cvut.cz, https://www.skwigly.co.uk, https://www.cgchannel.com]
      trial: "keyframes every ~24th frame (deterministic engine, optional artist pass) → EbSynth propagate → VLM scorecard vs baseline"
    - rank: 2
      id: w2.kuwahara-aniso-numpy
      what: "anisotropic Kuwahara in numpy (SPR103 upgrade)"
      why: "biggest painterly-quality jump with zero new dependencies; published for video; kornia mainstream viability"
      evidence: [https://onlinelibrary.wiley.com, https://www.kyprianidis.com, https://kornia.readthedocs.io]
      trial: "budget-test on b12 first (heaviest deterministic stage)"
    - rank: 3
      id: w2.animegan2-ab
      what: "AnimeGANv2 A/B on b12 (SPR101/102 neural comparison for the ADR-011 promotion gate)"
      why: "cheapest honest neural comparison; even a loss documents the flicker evidence; 2-3 s/frame CPU feasible for b12 (12s ≈ 300 frames ≈ 12.5 min)"
      caveats: ["weights provenance flag", "per-frame NST likely fails static-region-instability metric — test flow-warp mitigation", "torch-CPU pip install needed"]
      evidence: [https://github.com/bryandlee/animegan2-pytorch, https://ai-engine.net]
    - rank: 4
      id: w2.trackernano-spr205
      what: "TrackerNano/TrackerVit tracking hardening for SPR205"
      why: "VERIFIED-LOCAL classes + small ONNX downloads; contained trial"
      evidence: [VERIFIED-LOCAL]
    - rank: 5
      id: w2.fixed-lattice-halftone-spr104
      what: "screen-space fixed-lattice halftone for SPR104"
      why: "contained deterministic; closes manga with zero risk"
      evidence: [https://tabreturn.github.io, https://github.com/philgyford/python-halftone]
  not_worth_it:
    - id: reject.per-frame-generative
      what: "per-frame generative restyle of ANY kind (img2img per frame, hosted clay/anime image tools, AniSora/ToonCrafter/DynamiCrafter 'restyle' usage)"
      why: "the FORBIDDEN slideshow anti-pattern (Packet B FORBIDDEN list; ADR-012 compliance) — destroys temporal identity; per-frame cost $0.003-0.12/image or $0.04-0.30/video-second"
      evidence: [https://www.teamday.ai, https://replicate.com/seedance]
    - id: reject.full-v2v-diffusion-wave2
      what: "FlowVid / Pix2Video / Diffutoon / vid2vid in wave-2"
      why: "needs-gpu + keys; vid2vid & ToonCrafter non-commercial (red flags); Diffutoon stays wave-3 benchmark-only"
    - id: reject.rife-flow-upgrade
      what: "RIFE/RAFT flow upgrade for SPR201 trails in wave-2"
      why: "Farneback adequate for trail masks at 640x360; GPU dep not justified; revisit only if trail gates fail"
    - id: reject.rvm-matting
      what: "RVM anywhere (SPR202/109)"
      why: "weights CC-BY-NC — excluded from commercial path outright"
